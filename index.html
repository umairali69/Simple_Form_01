<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    body {
        /* background-color: azure; */
    }
    .man-cantiner {
        width: 500px;
        padding: 20px;
        margin: 20px 0;
        background-color: white;
        border-radius: 10px;
    }
    .form-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 15px;
    }
    .form-row label {
        width: 120px;
    }
    .form-row input {
        width: 300px;
        padding: 8px;
        box-sizing: border-box;
    }
    .radio-man {
        display: flex;
        align-items: flex-start;
        gap: 20px;
    }

    .left {
        width: 120px;
        padding-top: 10px;
    }

    .rite {
       display: flex;
       flex-direction:column;
       gap: 10px;
    }
    .man-checkbox {
       padding-top: 20px;
       display: flex;
       align-items: flex-start;
       gap: 20px;
    }
    .button {
       padding-top: 10px;
       text-align: center;
    }

   </style>
</head>
<body>
    <div class="man-cantiner">
    <form action="">
        <div class="form-row">
        <label for="Username">Username:</label>
         <input type="text" id="Username">
         </div>
         <div class="form-row">
          <label for="password">Password:</label>
          <input type="password" id="password">
         </div>
        <div class="form-row">
            <label for="city">City of:</label>
            <input type="text" id="city">
        </div>
        <div class="form-row">
            <label for="Employement">Employement:</label>
            <input type="text" id="Employement">
        </div>
        <div class="form-row"> 
            <label for="server">Web server:</label>
            <select name="Web server" id="Web server">
        <option value="" disabled selected>-----------------------choose a server-----------------</option>
        <option value="computer">computer</option>
        <option value="maths">maths</option>
        <option value="physics">physics</option>
    </select>
        </div>
        <div class="radio-man">
        <div class="left">
            <p>Please specify <br>your role:</p>
        </div>
        <div class="rite">
            <div>
            <input type="radio" name="g" id="Admin">
            <label for="Admin">Admin</label>
            </div>
            <div>
            <input type="radio" name="g" id="Engineer">
            <label for="Engineer">Engineer</label>
            </div>
            <div>
            <input type="radio" name="g" id="Manager">
            <label for="Manager">Manager</label>
            </div>
            <div>
            <input type="radio" name="g" id="Guest">
            <label for="Guest">Guest</label>
            </div>
        </div>
        </div>
        <div class="man-checkbox">
            <div class="left">
                <p>Single Sing-on <br>to the following:</p>
            </div>
            <div class="rite">
                <div>
                    <input type="checkbox" id="Mail">
                    <label for="Mail">Mail</label>
                </div>
                <div>
                    <input type="checkbox" id="Payroll">
                    <label for="Payroll">Payroll</label>
                </div>
                <div>
                    <input type="checkbox" id="server">
                    <label for="server">Self-service</label>
                </div>
            </div>
        </div>
        <div class="button">
            <button type="submit" class="login">Login</button>
            <button type="reset" class="reset">Reset</button>
        </div>
    </div>
    </form>
</body>
</html>
